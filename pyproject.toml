[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spektrolab"
dynamic = ["version"]
description = "Учебный USB-спектрометр: обработка спектров, калибровка, закон Планка, протоколы"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SpektroLab contributors" }]
keywords = ["spectrometer", "spectroscopy", "physics", "education", "planck", "opencv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "matplotlib>=3.7",
    "opencv-python>=4.8",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
spektrolab = "spektrolab.cli:main"

[project.urls]
Homepage = "https://github.com/vetalek332-cell/spektrolab"
Repository = "https://github.com/vetalek332-cell/spektrolab"
"Hardware design" = "https://github.com/vetalek332-cell/spektrolab/tree/main/hardware"

[tool.hatch.version]
path = "src/spektrolab/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spektrolab"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
